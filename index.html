<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="app-release" content="e4a05500a9f367f8">
<link rel="manifest" href="./manifest.webmanifest">
<title>Dziennik interwałów</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f4f4; --card: #fff; --ink: #171717; --muted: #555;
  --line: #707070; --rule: #d4d4d4; --tag-bg: #eaeaea;
  --accent: #366bcd;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212; --card: #1c1c1c; --ink: #f5f5f5; --muted: #b8b8b8;
    --line: #888; --rule: #3b3b3b; --tag-bg: #303030;
  }
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--bg); font: 1rem/1.375 system-ui, sans-serif; }
main {
  display: flex; flex-direction: column; max-width: 680px; min-height: 100dvh; margin: auto;
  padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
}
h1, h2 { margin: 0; font-size: 1.25rem; line-height: 1.5rem; }
h2 { margin-bottom: 8px; }
p { margin: 8px 0; }
.card { margin-top: 12px; padding: 8px 12px; border-radius: 12px; background: var(--card); }
.muted, small { color: var(--muted); }
small, .entry-head, .run-state, #stop, #backupReminder { font-size: .875rem; line-height: 1.25rem; }
.measurement, .entry-head, .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.measurement { min-height: 48px; margin-top: 12px; padding: 0 4px; }
.run-state { display: inline-flex; gap: 6px; align-items: center; font-weight: 650; }
.run-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.row > * { flex: 1; }
.timer, .entry-head, .day-line { font-variant-numeric: tabular-nums; }
.timer { font-size: 2rem; line-height: 2.25rem; font-weight: 750; overflow-wrap: anywhere; }
button, textarea { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
button, summary, a, textarea, .check { min-height: 48px; }
button { min-width: 48px; padding: 8px 12px; }
button, summary { cursor: pointer; font-weight: 650; touch-action: manipulation; }
button:disabled { opacity: .5; cursor: default; }
button:active:enabled { box-shadow: inset 0 0 0 2px currentColor; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
#stop { margin-inline-start: auto; border: 0; background: transparent; color: var(--muted); text-decoration: underline; }
#backupReminder { display: flex; align-items: center; padding: 4px; color: var(--muted); }
.actions {
  position: sticky; bottom: 0; z-index: 1; margin-top: auto;
  padding: 8px 4px max(8px, env(safe-area-inset-bottom));
  background: var(--card); border-top: 1px solid var(--rule);
}
.actions:has(button:disabled) { display: none; }
main:has(#note:focus) .actions { position: static; }
#measure { width: 100%; min-height: 56px; color: #fff; background: var(--accent); border-color: var(--accent); }
summary { padding: 12px 0; }
textarea { display: block; width: 100%; padding: 8px; resize: vertical; }
#note { min-height: 56px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--ink); }
#editor { border: 1px solid var(--line); }
.field-label { display: block; margin: 8px 0 4px; font-weight: 650; }
.editor-actions { margin-top: 8px; }
#history { margin-top: 8px; }
.history-day + .history-day { border-top: 1px solid var(--rule); }
.history-day > summary { padding-inline: 4px; }
.day-line { display: inline-flex; width: calc(100% - 1.25em); vertical-align: top; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; }
.day-line > :last-child { color: var(--muted); font-size: .875rem; }
.day-entries { display: grid; gap: 8px; padding-bottom: 8px; }
.gap, .entry-meta { font-size: .875rem; color: var(--muted); }
.entry { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 400; }
.entry[aria-current=true] { box-shadow: inset 2px 0 var(--ink); }
.entry-head { font-weight: 700; }
.entry-head strong { margin-inline-start: auto; }
.entry-note { display: block; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; overflow-wrap: anywhere; }
.tag { border-radius: 4px; padding: 0 5px; background: var(--tag-bg); }
.badge { font-weight: 700; }
#backupPanel { margin-bottom: 12px; }
#backupPanel > summary, #restorePanel > summary { display: list-item; }
#backup { scroll-margin-block: 12px 80px; }
#backupJson, #importJson { min-height: 8rem; font: .875rem/1.5 ui-monospace,monospace; }
#backupSaved, #importBackup { margin-top: 8px; }
#storageError { border: 2px solid var(--line); padding: 12px; }
#storageError, #dialogText, #importStatus { white-space: pre-line; }
#message:empty, #backupStatus:empty, #importStatus:empty { margin: 0; }
dialog { max-width: min(440px,95vw); padding: 16px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; }
dialog::backdrop { background: #0009; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
<header><h1>Dziennik interwałów</h1></header>
<div id="storageError" class="card" role="alert" hidden></div>
<div id="appUpdate" class="card" hidden>
  <p role="status">Nowa wersja gotowa. Zapisz lub skopiuj rozpoczęty import przed aktualizacją.</p>
  <button id="applyUpdate">Zaktualizuj</button>
</div>
<section class="measurement" aria-label="Pomiar czasu">
  <div>
    <div id="runState" class="run-state" hidden>Trwa</div>
    <div id="timer" class="timer" aria-label="Czas bieżącego interwału">00:00</div>
  </div>
  <button id="stop" hidden>Zatrzymaj pomiar</button>
</section>
<section id="editor" class="card" hidden aria-labelledby="editorTitle">
  <h2 id="editorTitle">Zamknięty interwał</h2>
  <div id="editorTime" class="muted"></div>
  <label class="field-label" for="note">Co robiłem?</label>
  <textarea id="note" aria-describedby="noteHint"></textarea>
  <small id="noteHint">Zapisuje się podczas pisania.</small>
  <div class="row editor-actions"><button id="done">Gotowe</button><button id="delete">Usuń wpis</button></div>
  <label class="check"><input id="blocked" type="checkbox"><strong>! blokada</strong></label>
</section>
<p id="message" class="muted" role="status" aria-live="polite"></p>
<a id="backupReminder" href="#backup" hidden></a>
<section id="history" aria-label="Historia interwałów">
  <p id="empty" class="muted">Brak zapisanych interwałów.</p>
  <div id="entries"></div>
</section>
<details id="backupPanel" class="card">
  <summary>Ustawienia i dane</summary>
  <button id="backup">Kopiuj dane</button>
  <p id="backupStatus" role="status" aria-live="polite"></p>
  <div id="manualBackup" hidden>
    <label class="field-label" for="backupJson">Kopia do ręcznego skopiowania</label>
    <textarea id="backupJson" readonly spellcheck="false" wrap="off"></textarea>
    <button id="backupSaved" hidden>Potwierdzam zapisanie kopii</button>
  </div>
  <details id="restorePanel">
    <summary>Przywróć z kopii</summary>
    <label class="field-label" for="importJson">Wklej kopię JSON</label>
    <textarea id="importJson" spellcheck="false"></textarea>
    <button id="importBackup">Sprawdź kopię</button>
    <p id="importStatus" role="status" aria-live="polite"></p>
  </details>
  <p id="lastBackupStatus" class="muted"></p>
  <p id="persistenceStatus" class="muted" role="status">Sprawdzanie trwałości pamięci…</p>
  <p class="muted">Wersja aplikacji <span id="appRelease"></span></p>
  <button id="clear">Wyczyść wszystko</button>
</details>
<div class="actions">
  <button id="measure" disabled>Start</button>
</div>
</main>
<dialog id="dialog" aria-labelledby="dialogTitle" aria-describedby="dialogText"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="row"><button id="cancelDialog" autofocus>Anuluj</button><button id="confirmDialog"></button></div></dialog>
<script>
(() => {
'use strict';
// Klucz pozostaje stały; format danych określa schemaVersion.
const KEY = 'dziennik-interwalow-v1';
const SCHEMA_VERSION = 2;
const BACKUP_AGE = 7 * 24 * 60 * 60 * 1000;
const $ = id => document.getElementById(id);
const fresh = () => ({schemaVersion:SCHEMA_VERSION,session:null,current:null,entries:[],editor:null,wake:false,filter:'today',lastBackupAt:null});
let state = fresh(), broken = false, wakeLock = null, wakePending = false, confirmation = null, lastDay = '', needsMigrationSave = false, pendingBackupAt = null;
const pad = n => String(n).padStart(2,'0');
const date = ts => {const d = new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const time = ts => {const d = new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;};
const duration = ms => {const s = Math.max(0,Math.floor(ms/1000)),m = Math.floor(s/60);return m < 60 ? `${pad(m)}:${pad(s%60)}` : `${Math.floor(m/60)}:${pad(m%60)}:${pad(s%60)}`;};
const validTime = n => Number.isFinite(n) && n >= 0 && n <= 8640000000000000;
function validateBase(s) {
 if (!s || typeof s!=='object' || Array.isArray(s) || !Array.isArray(s.entries) || typeof s.wake!=='boolean' || !['today','all'].includes(s.filter)) throw Error('Nieprawidłowa struktura stanu.');
 if (s.session!==null && (!s.session || !validTime(s.session.start) || (s.session.end!==null && (!validTime(s.session.end) || s.session.end<s.session.start)))) throw Error('Nieprawidłowy zakres pomiaru.');
 if (s.current!==null && (!s.current || !validTime(s.current.start) || !s.session || s.session.end!==null || s.current.start<s.session.start)) throw Error('Nieprawidłowy bieżący interwał.');
 if (s.session && s.session.end===null && s.current===null) throw Error('Brak bieżącego interwału w aktywnym pomiarze.');
 const ids = new Set();
 for (const e of s.entries) {if (!e || typeof e.id!=='string' || !e.id || ids.has(e.id) || !validTime(e.start) || !validTime(e.end) || e.end<e.start || typeof e.note!=='string' || typeof e.blocked!=='boolean') throw Error('Nieprawidłowy interwał lub powtórzony identyfikator.');ids.add(e.id);}
 if (s.editor!==null && (typeof s.editor!=='string' || !ids.has(s.editor))) throw Error('Nieprawidłowy edytowany wpis.');
 return s;
}
function validateV1(s) {validateBase(s);return s;}
// Każda kolejna migracja ma osobną funkcję i zachowuje pozostałe pola.
function migrateV1ToV2(s) {
 return {...s,schemaVersion:2,entries:s.entries.map(e=>({...e,tag:e.tag??''})),lastBackupAt:s.lastBackupAt??null};
}
function validateV2(s) {
 validateBase(s);
 if(s.schemaVersion!==SCHEMA_VERSION || (s.lastBackupAt!==null&&!validTime(s.lastBackupAt)) || s.entries.some(e=>typeof e.tag!=='string')) throw Error('Nieprawidłowe dane wersji 2.');
 return s;
}
function migrateState(s) {
 let version=s?.schemaVersion??s?.version;
 if(version===1){validateV1(s);s=migrateV1ToV2(s);version=2;}
 if(version!==SCHEMA_VERSION)throw Error('Nieobsługiwana wersja danych. Nie zmieniono lokalnych danych.');
 return validateV2(s);
}
function storageError(text) {$('storageError').textContent=text;$('storageError').hidden=false;}
let futureData = null;
function detectFutureData(raw) {
 if(raw===null)return false;
 const parsed=JSON.parse(raw);
 if(!(parsed?.schemaVersion>SCHEMA_VERSION))return false;
 const firstDetection=futureData===null;
 futureData={raw,parsed};
 broken=true;
 pendingBackupAt=null;
 $('backupSaved').hidden=true;
 if(firstDetection){state=fresh();state.filter='all';}
 storageError('Dane zapisała nowsza wersja dziennika. Zapis jest zablokowany. Możesz użyć „Kopiuj dane” w ustawieniach. Otwórz aktualną wersję aplikacji.');
 return true;
}
try {const raw=localStorage.getItem(KEY);if(raw!==null&&!detectFutureData(raw)){const parsed=JSON.parse(raw);state=migrateState(parsed);needsMigrationSave=parsed.schemaVersion!==SCHEMA_VERSION;}}
catch(e){broken=true;storageError('Nie można odczytać zapisanych danych. Nie nadpisujemy ich. Spróbuj ponownie otworzyć stronę; „Wyczyść wszystko” pozwala świadomie zacząć od nowa.');}
function save(nextState=state, reset=false){
 if(broken&&!reset)return false;
 try{
  const raw=localStorage.getItem(KEY);
  let newer=false;
  try{newer=detectFutureData(raw);}catch(e){if(!reset)throw e;}
  if(newer||futureData){
   render();syncWake();return false;
  }
  localStorage.setItem(KEY,JSON.stringify(nextState));$('storageError').hidden=true;return true;
 }
 catch(e){storageError('Nie udało się zapisać zmian w przeglądarce (np. brak miejsca lub zablokowany zapis). Bieżące dane są tylko w pamięci — skopiuj dane przed zamknięciem strony.');return false;}
}
function say(text){$('message').textContent=text;}
function edited(){return state.entries.find(e=>e.id===state.editor);}
function span(e){return `${date(e.start)} · ${time(e.start)} – ${date(e.start)!==date(e.end)?date(e.end)+' ':''}${time(e.end)} · ${duration(e.end-e.start)}`;}
function tick(){
 const now=Date.now();
 $('timer').textContent=duration(state.current?now-state.current.start:0);
 const day=date(now);
 if(day!==lastDay){lastDay=day;renderList(now);}
 if(liveDay){
  const {part,total,totalLabel,durationLabel,longLabel}=liveDay;
  const stop=Math.max(part.start,now);
  totalLabel.textContent='Zapisano '+minutesText(Math.round((total+stop-part.stop)/60000));
  if(durationLabel)durationLabel.textContent=duration(stop-part.start);
  if(longLabel)longLabel.hidden=stop-part.entry.start<LONG_INTERVAL;
 }
 renderBackupReminder(now);
}
const dayFormat=new Intl.DateTimeFormat('pl-PL',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dayChoices=new Map();
const visibleParts=new WeakMap();
const LONG_INTERVAL=8*60*60*1000;
let liveDay=null;
function midnight(ts,offset=0){
 const d=new Date(ts);
 return new Date(d.getFullYear(),d.getMonth(),d.getDate()+offset).getTime();
}
function groupDays(now){
 const days=new Map();
 function split(entry,running){
  const end=running?Math.max(entry.start,now):entry.end;
  let start=entry.start, boundary;
  do {
   const key=midnight(start);
   boundary=midnight(start,1);
   const stop=Number.isFinite(boundary)?Math.min(end,boundary):end;
   if(!days.has(key))days.set(key,{key,total:0,parts:[]});
   const day=days.get(key);
   const part={entry,start,stop,end,running,live:running&&stop!==boundary};
   day.total+=stop-start;
   day.parts.push(part);
   start=stop;
  } while(start<end || (running&&start===boundary));
 }
 for(const entry of state.entries)split(entry,false);
 if(state.current)split(state.current,true);
 return [...days.values()].sort((a,b)=>b.key-a.key);
}
function element(type,content,className){
 const node=document.createElement(type);
 if(content!=null)node.textContent=content;
 if(className)node.className=className;
 return node;
}
function minutesText(minutes){
 return minutes<60?minutes+' min':Math.floor(minutes/60)+' godz. '+pad(minutes%60)+' min';
}
function entryRow(part){
 const {entry,start,stop,end,running,live}=part;
 const row=element(running?'div':'button',null,'entry');
 if(!running){
  row.type='button';row.dataset.id=entry.id;row.disabled=broken;
  visibleParts.set(row,part);
  row.setAttribute('aria-current',String(entry.id===state.editor));
 }
 const head=element('span',null,'entry-head');
 const until=live?'teraz':stop>start&&stop===midnight(start,1)?'24:00':time(stop).slice(0,5);
 const length=element('strong',duration(stop-start));
 head.append(element('span',time(start).slice(0,5)+' – '+until),length);
 row.append(head);
 if(!running&&(entry.note!==entry.tag||!entry.tag)){
  row.append(element('span',entry.note||'Dotknij, aby dodać notatkę',entry.note?'entry-note':'entry-note muted'));
 }
 const meta=element('span',null,'entry-meta');
 if(running)meta.append(element('span','Trwa','run-state'));
 else if(entry.tag)meta.append(element('span',entry.tag,'tag'));
 if(start>entry.start)meta.append(element('span','od wczoraj'));
 if(stop<end || (running&&!live))meta.append(element('span','ciąg dalszy jutro'));
 if(running||end-entry.start>=LONG_INTERVAL){
  const marker=element('span','długi interwał');
  marker.hidden=end-entry.start<LONG_INTERVAL;
  meta.append(marker);
  if(live&&part===liveDay?.part){liveDay.durationLabel=length;liveDay.longLabel=marker;}
 }
 if(entry.blocked)meta.append(element('span','! blokada','badge'));
 if(meta.childElementCount)row.append(meta);
 return row;
}
function dayContents(day){
 const cards=element('div',null,'day-entries');
 day.parts.sort((a,b)=>b.start-a.start || b.stop-a.stop);
 for(const part of day.parts)cards.append(entryRow(part));
 return cards;
}
function renderList(now=Date.now()){
 for(const old of $('entries').querySelectorAll('details[data-day]'))dayChoices.set(Number(old.dataset.day),old.open);
 const days=groupDays(now), fragment=document.createDocumentFragment();
 const today=midnight(now);
 const defaultDay=days.some(d=>d.key===today)?today:days[0]?.key;
 let newer=null;
 liveDay=null;
 for(const day of days){
  if(newer!==null&&midnight(day.key,1)<newer){
   const first=midnight(day.key,1),last=midnight(newer,-1);
   const range=dayFormat.format(first)+(first===last?'':' – '+dayFormat.format(last));
   fragment.append(element('p',range+' · brak zapisów','gap'));
  }
  newer=day.key;
  const section=element('details',null,'history-day');
  section.dataset.day=day.key;
  const summary=element('summary'), line=element('span',null,'day-line');
  const totalLabel=element('span','Zapisano '+minutesText(Math.round(day.total/60000)));
  line.append(element('span',day.key===today?'Dzisiaj · '+dayFormat.format(day.key):dayFormat.format(day.key)),totalLabel);
  summary.append(line);section.append(summary);
  const part=day.parts.find(part=>part.live);
  if(part)liveDay={part,total:day.total,totalLabel};
  section.open=dayChoices.get(day.key)??(day.key===defaultDay);
  const fill=()=>{if(section.open&&!summary.nextElementSibling)section.append(dayContents(day));};
  fill();
  section.addEventListener('toggle',()=>{
   if(!section.isConnected)return;
   dayChoices.set(day.key,section.open);
   fill();
   if(section.open&&part)tick();
  });
  fragment.append(section);
 }
 $('entries').replaceChildren(fragment);
 $('empty').hidden=days.length>0;
}
function renderEditor(focus=false){const e=edited();$('editor').hidden=!e;if(!e)return;$('editorTime').textContent=span(e);$('note').value=e.note;$('blocked').checked=e.blocked;if(focus){$('note').focus();$('editor').scrollIntoView({block:'nearest'});}}
function render(focus=false){
 const running=!!state.current;
 $('measure').disabled=broken;
 $('measure').textContent=running?'Koniec interwału':'Start';
 $('stop').hidden=!running||broken;
 $('runState').hidden=!running;
 $('backup').disabled=broken&&!futureData;
 $('restorePanel').hidden=broken;
 $('importBackup').disabled=broken;
 $('clear').disabled=!!futureData;
 $('importJson').disabled=broken;
 for(const id of ['note','blocked','done','delete'])$(id).disabled=broken;
 lastDay=date(Date.now());
 renderList();renderEditor(focus&&!broken);tick();
}
function boundary(keepRunning){
 if(!state.current||broken)return;
 const now=Math.max(Date.now(),state.current.start);
 const id=globalThis.crypto?.randomUUID?.()??now+'-'+Math.random().toString(36).slice(2);
 state.entries.unshift({id,start:state.current.start,end:now,note:'',blocked:false,tag:''});state.editor=id;
 state.current=keepRunning?{start:now}:null;if(!keepRunning)state.session.end=now;
 save();render(true);syncWake();
}
$('measure').addEventListener('click',()=>{
 if(broken)return;
 if(state.current){boundary(true);return;}
 const now=Date.now();
 state.session={start:now,end:null};state.current={start:now};
 save();render();syncWake();
});
$('stop').addEventListener('click',()=>boundary(false));
$('note').addEventListener('input',()=>{
 const e=edited();if(!e||broken)return;
 e.note=$('note').value;save();
 for(const row of $('entries').querySelectorAll('button[data-id]')){
  if(row.dataset.id===e.id)row.replaceWith(entryRow(visibleParts.get(row)));
 }
});
$('blocked').addEventListener('change',()=>{const e=edited();if(!e||broken)return;e.blocked=$('blocked').checked;save();renderList();});
$('done').addEventListener('click',()=>{
 if(broken)return;
 state.editor=null;save();renderEditor();renderList();
 $('measure').focus({preventScroll:true});
});
$('entries').addEventListener('click',event=>{
 const b=event.target.closest('button[data-id]');if(!b||broken)return;
 state.editor=b.dataset.id;save();renderList();renderEditor(true);
});
function renderBackupReminder(now=Date.now()){
 const last=state.lastBackupAt;
 const reminder=$('backupReminder');
 reminder.hidden=broken||(last!==null&&now-last<=BACKUP_AGE);
 reminder.textContent=last===null?'Brak kopii danych':'Ostatnia kopia ma ponad 7 dni';
 $('lastBackupStatus').textContent=last===null?'Ostatnia kopia: brak.':'Ostatnia kopia: '+date(last)+' '+time(last);
}
$('backupReminder').addEventListener('click',event=>{
 event.preventDefault();
 $('backupPanel').open=true;
 $('backup').focus({preventScroll:true});
 $('backup').scrollIntoView({block:'nearest'});
});
async function requestPersistentStorage(){
 try{
  if(!navigator.storage?.persist){$('persistenceStatus').textContent='Trwała pamięć: przeglądarka nie obsługuje tej funkcji.';return;}
  const granted=await navigator.storage.persist();
  const persistent=navigator.storage.persisted?await navigator.storage.persisted():granted;
  $('persistenceStatus').textContent=persistent?'Trwała pamięć: tak.':'Trwała pamięć: nie — przeglądarka nie przyznała ochrony. Regularnie kopiuj dane.';
 }catch(e){$('persistenceStatus').textContent='Trwała pamięć: nie udało się sprawdzić ani uzyskać ochrony. Dane nadal zapisują się w localStorage.';}
}
function selectBackup(){
 $('backupPanel').open=true;$('manualBackup').hidden=false;
 const field=$('backupJson');field.focus();field.select();field.setSelectionRange(0,field.value.length);
}
function markBackupSaved(at){state.lastBackupAt=Math.max(state.lastBackupAt??0,at);save();renderBackupReminder();}
async function copyBackup(){
 const status=$('backupStatus');
 $('manualBackup').hidden=true;
 if(futureData){
  $('backupJson').value=futureData.raw;
  try{await navigator.clipboard.writeText($('backupJson').value);status.textContent='Dane skopiowane. Zachowaj kopię poza aplikacją.';}
  catch(e){selectBackup();status.textContent='Skopiuj ręcznie zaznaczoną kopię.';}
  return;
 }
 if(broken)return;
 const at=Date.now(),source=state;
 // Data w kopii opisuje wykonanie tej kopii. Lokalnie uznajemy ją za zapisaną
 // dopiero po sukcesie schowka lub ręcznym potwierdzeniu użytkownika.
 const snapshot={...state,lastBackupAt:at};
 $('backupJson').value=JSON.stringify(snapshot,null,2);pendingBackupAt=at;
 $('backupSaved').hidden=true;
 try{
  await navigator.clipboard.writeText($('backupJson').value);
  // Nie oznaczaj innego stanu, np. wyczyszczonego podczas oczekiwania na schowek.
  if(state===source){markBackupSaved(at);pendingBackupAt=null;}
  status.textContent='Dane skopiowane. Zachowaj kopię poza aplikacją.';
 }catch(e){
  if(state===source){$('backupSaved').hidden=false;selectBackup();}
  status.textContent='Skopiuj zaznaczony tekst i potwierdź zapisanie kopii.';
 }
}
$('backup').addEventListener('click',copyBackup);
$('backupSaved').addEventListener('click',()=>{if(pendingBackupAt===null)return;markBackupSaved(pendingBackupAt);pendingBackupAt=null;$('backupSaved').hidden=true;$('manualBackup').hidden=true;$('backupStatus').textContent='Zapisanie kopii potwierdzone.';});
function importPlan(incoming){
 const restore=state.entries.length===0&&state.session===null&&state.current===null;
 const existing=new Map(state.entries.map(e=>[e.id,e]));
 let added=0,common=0,conflicts=0;
 for(const e of incoming.entries){const local=existing.get(e.id);if(!local)added++;else{common++;if(JSON.stringify(local)!==JSON.stringify(e))conflicts++;}}
 const merged=restore?incoming:{...state,entries:[...state.entries,...incoming.entries.filter(e=>!existing.has(e.id))].sort((a,b)=>b.start-a.start||b.end-a.end||a.id.localeCompare(b.id))};
 const timestamps=[];for(const e of incoming.entries)timestamps.push(e.start,e.end);if(incoming.session)timestamps.push(incoming.session.start,incoming.session.end??incoming.current.start);
 let first=null,last=null;for(const ts of timestamps){first=first===null?ts:Math.min(first,ts);last=last===null?ts:Math.max(last,ts);}
 const range=first===null?'brak dat':date(first)+' '+time(first)+' — '+date(last)+' '+time(last);
 const summary='Interwały w kopii: '+incoming.entries.length+'. Nowe: '+added+'. Wspólne ID: '+common+'.'+
  '\nZakres dat: '+range+'.'+
  (conflicts?'\nRóżniące się wpisy ze wspólnym ID: '+conflicts+'. Zachowamy lokalną wersję.':'')+
  (restore?'\nPusta aplikacja: przywrócimy cały stan, także ustawienia i trwający pomiar.':'\nScalimy zakończone interwały. Bieżący pomiar, ustawienia i edytowana notatka pozostaną lokalne.')+
  (!restore&&incoming.current?'\nKopia zawiera trwający pomiar, który można przywrócić w pustym dzienniku.':'');
 return {next:validateV2(merged),summary,added};
}
function previewImport(incoming){
 const plan=importPlan(incoming),baseline=JSON.stringify(state);
 $('importStatus').textContent=plan.summary;
 ask('Przywrócić dane z kopii?',plan.summary,'Potwierdź przywrócenie',()=>{
  if(JSON.stringify(state)!==baseline){$('importStatus').textContent='Dane zmieniły się podczas podglądu. Sprawdź aktualne podsumowanie.';previewImport(incoming);return;}
  // Najpierw trwały zapis, dopiero potem podmiana stanu w pamięci.
  if(!save(plan.next)){$('importStatus').textContent='Import nie został zapisany. Dotychczasowy stan pozostaje bez zmian.';return;}
  state=plan.next;pendingBackupAt=null;$('backupSaved').hidden=true;$('manualBackup').hidden=true;
  render();syncWake();$('importStatus').textContent='Import zakończony. Dodano interwałów: '+plan.added+'. Łącznie: '+state.entries.length+'.';
 });
}
$('importBackup').addEventListener('click',()=>{
 if(broken)return;
 try{const incoming=migrateState(JSON.parse($('importJson').value));previewImport(incoming);}
 catch(e){$('importStatus').textContent='Nie można przywrócić kopii: '+e.message;}
});
function ask(title,text,button,action){$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('confirmDialog').textContent=button;confirmation=action;if(!$('dialog').open)$('dialog').showModal();else $('cancelDialog').focus();}
$('cancelDialog').addEventListener('click',()=>{$('dialog').close();confirmation=null;});
$('dialog').addEventListener('cancel',()=>{confirmation=null;});
$('confirmDialog').addEventListener('click',()=>{const action=confirmation;confirmation=null;$('dialog').close();action?.();});
$('delete').addEventListener('click',()=>{const e=edited();if(!e)return;ask('Usunąć ten wpis?',span(e)+'\nNotatka zostanie usunięta. Pomiar trwającego interwału będzie kontynuowany.','Usuń wpis',()=>{state.entries=state.entries.filter(x=>x.id!==e.id);state.editor=null;save();render();say('Wpis usunięty.');});});
$('clear').addEventListener('click',()=>ask('Wyczyścić wszystko?','Krok 1 z 2. Usuniesz wszystkie interwały i notatki oraz zatrzymasz pomiar. Najpierw możesz anulować i skopiować dane.','Dalej',()=>ask('Ostateczne potwierdzenie','Krok 2 z 2. Tego usunięcia nie można cofnąć.','Tak, usuń wszystko',()=>{
 const empty=fresh();
 if(!save(empty,true))return;
 state=empty;broken=false;pendingBackupAt=null;$('backupSaved').hidden=true;$('manualBackup').hidden=true;
 render();syncWake();$('backupStatus').textContent='Wszystkie dane wyczyszczone.';
})));
async function syncWake(){
 if(!('wakeLock' in navigator))return;
 if(!state.wake||!state.current||document.visibilityState!=='visible'){
  if(wakeLock){const old=wakeLock;wakeLock=null;try{await old.release();}catch(e){}}
  return;
 }
 if(wakeLock||wakePending)return;wakePending=true;
 try{const lock=await navigator.wakeLock.request('screen');wakeLock=lock;lock.addEventListener('release',()=>{if(wakeLock===lock)wakeLock=null;});}
 catch(e){}
 finally{wakePending=false;if(wakeLock&&(!state.wake||!state.current||document.visibilityState!=='visible'))syncWake();}
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible' && state.current)renderList();
 tick();syncWake();
});
window.addEventListener('pageshow',event=>{if(event.persisted && state.current)renderList();tick();syncWake();});
window.addEventListener('storage',event=>{
 if(event.key!==KEY&&event.key!==null)return;
 try{
  const raw=localStorage.getItem(KEY);
  if(detectFutureData(raw)){render();syncWake();return;}
  state=raw===null?fresh():migrateState(JSON.parse(raw));
  futureData=null;pendingBackupAt=null;$('backupSaved').hidden=true;$('manualBackup').hidden=true;broken=false;$('storageError').hidden=true;
  render();syncWake();say('Wczytano zmianę z drugiej karty. Używaj jednej karty do pomiaru.');
 }catch(e){broken=true;render();storageError('Dane zmieniły się w innej karcie i nie można ich odczytać. Otwórz stronę ponownie.');}
});
if(needsMigrationSave)save();
render();syncWake();requestPersistentStorage();setInterval(tick,500);

$('appRelease').textContent=document.querySelector('meta[name="app-release"]').content;
if('serviceWorker' in navigator){
 const serviceWorker=navigator.serviceWorker;
 serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(registration=>{
  let requestedWorker=null;
  function showUpdate(){
   $('appUpdate').hidden=!registration.waiting;
   $('applyUpdate').disabled=!!requestedWorker;
  }
  function watchInstallation(){
   registration.installing?.addEventListener('statechange',showUpdate);
  }
  const checkForUpdate=()=>registration.update().catch(()=>{});
  registration.addEventListener('updatefound',watchInstallation);
  watchInstallation();
  showUpdate();
  serviceWorker.addEventListener('controllerchange',()=>{
   if(requestedWorker&&serviceWorker.controller===requestedWorker)location.reload();
   else showUpdate();
  });
  $('applyUpdate').addEventListener('click',()=>{
   const waiting=registration.waiting;
   if(!waiting||requestedWorker)return;
   const controlled=!!serviceWorker.controller;
   requestedWorker=waiting;
   showUpdate();
   waiting.addEventListener('statechange',()=>{
    if(waiting.state==='activated'&&!controlled)location.reload();
    if(waiting.state==='redundant'){requestedWorker=null;showUpdate();}
   });
   waiting.postMessage('SKIP_WAITING');
  });
  document.addEventListener('visibilitychange',()=>{
   if(document.visibilityState==='visible')checkForUpdate();
  });
  window.addEventListener('online',checkForUpdate);
  checkForUpdate();
 }).catch(error=>console.warn('Nie udało się uruchomić obsługi offline.',error));
}
})();
</script>
